SECS.push({id:'rx',k:'gv',top:1,n:'Repaso: 7 errores muy frecuentes',m:6,t:'mc',len:12,les:`Estos 7 patrones de error son muy frecuentes en hispanohablantes de nivel B1-B2. Cada pregunta entrena uno de ellos.\n\n1. Condicional mixto: no mires el principio de la frase; mira cuándo ocurre el resultado. Resultado ahora (now, by now, these days) → would + verbo. Resultado en el pasado (yesterday, last week) → would have + participio.\n2. Past perfect: cuando en español dirías «había», en inglés va had + participio. Has/have solo si el resultado afecta al presente.\n3. Phrasal verbs: aprende cada uno con su frase. bring about = provocar; look after = cuidar; look for = buscar; look into = investigar.\n4. Verbos de mirar: glance = vistazo rápido; stare = mirar fijamente; peer = mirar con esfuerzo algo que se ve mal.\n5. Orden de palabras: el sustantivo que describe va delante (office work, management job).\n6. Después de that va una frase completa con sujeto y verbo (I think that the course is…). -ing va después de una preposición o de verbos como enjoy, worth o avoid.\n7. Listening Man / Woman / Both: si uno opina y el otro confirma (Absolutely, Exactly, I agree), es Both. Si el otro lo discute (Really? I've never…), solo uno.`,items:[
[`If she had taken the train, she ___ here by now.`,[`would be`,`would have been`,`will be`],0,`Condicional mixto. By now = ahora: resultado presente → would + verbo. «Si hubiera cogido el tren, ya estaría aquí».`,2,'cond'],
[`If I had learnt to drive, I ___ the bus every day now.`,[`wouldn't take`,`wouldn't have taken`,`won't take`],0,`Now marca un resultado presente: wouldn't + verbo. «Si hubiera aprendido a conducir, no cogería el autobús».`,2,'cond'],
[`If he had checked the address, he ___ lost yesterday.`,[`wouldn't have got`,`wouldn't get`,`won't get`],0,`Aquí el resultado es pasado (yesterday): tercer condicional, would have + participio. Compáralo con las dos anteriores.`,2,'cond'],
[`When the police arrived, the thieves ___.`,[`had already escaped`,`have already escaped`,`had already been escaped`],0,`«Ya habían escapado»: past perfect (had + participio). No es pasiva: los ladrones escapan ellos mismos.`,2,'pp'],
[`I couldn't get into the flat because I ___ my keys.`,[`had lost`,`have lost`,`have been lost`],0,`Perdió las llaves antes de no poder entrar: dos momentos del pasado → had lost.`,2,'pp'],
[`I ___ the report, so I can help you now.`,[`have finished`,`had finished`,`have been finished`],0,`Ahora sí va have: el resultado afecta al presente (can help you now). Compárala con las dos anteriores.`,2,'pp'],
[`Lack of sleep can ___ serious health problems.`,[`bring about`,`bring up`,`bring back`],0,`Bring about = provocar, causar. Bring up = criar o sacar un tema; bring back = devolver.`,2,'voc'],
[`Who is going to ___ the children while you're at work?`,[`look after`,`look for`,`look into`],0,`Look after = cuidar. Look for = buscar; look into = investigar.`,1,'voc'],
[`The company promised to ___ my complaint and reply within a week.`,[`look into`,`look after`,`look up`],0,`Look into = investigar, estudiar un asunto.`,2,'voc'],
[`I've been ___ my glasses all morning. Have you seen them?`,[`looking for`,`looking after`,`looking into`],0,`Look for = buscar.`,1,'voc'],
[`The children ___ at the elephant in amazement for several minutes.`,[`stared`,`glanced`,`peered`],0,`Stare = mirar fijamente y durante un rato. El elefante se ve bien, así que no hace falta esfuerzo (peer).`,2,'voc'],
[`He ___ through the fog, trying to read the road sign.`,[`peered`,`glanced`,`stared`],0,`Peer = mirar con esfuerzo algo que se ve mal (fog, trying to read).`,2,'voc'],
[`She has applied for a ___.`,[`management job`,`job of management`,`job management`],0,`El sustantivo que describe va delante: management job (trabajo de gestión), como office work.`,2,'orden'],
[`We need a new ___ for the kitchen.`,[`coffee machine`,`machine of coffee`,`machine coffee`],0,`Coffee machine = cafetera. El orden es el contrario al del español.`,1,'orden'],
[`This museum is really worth ___.`,[`visiting`,`to visit`,`visit`],0,`Worth + -ing. Era tu fallo de It is worth study → It is worth studying.`,2,'ger'],
[`I think that ___ every day is the best way to learn.`,[`practising`,`practise`,`to practising`],0,`Después de that va una frase completa. Aquí el sujeto de esa frase es practising every day y el verbo es is.`,2,'ger'],
[`I think that the course ___ very useful.`,[`is`,`being`,`to be`],0,`That + sujeto (the course) + verbo conjugado (is). Después de that no va -ing por sí solo.`,1,'ger'],
[`I really enjoy ___ new recipes at the weekend.`,[`trying`,`to try`,`try`],0,`Enjoy + -ing: la actividad que disfrutas.`,1,'ger'],

/* Repaso personal 2: preguntas NUEVAS sobre los errores reales de su copia de seguridad (27 preguntas en el banco de errores, 18/11/2026). */
SECS.push({id:'ry',k:'gv',top:1,n:'Repaso: 5 patrones de error que más se repiten',m:7,t:'mc',len:12,les:`Repetir la misma pregunta no basta: este repaso trae preguntas distintas con la misma regla.

Los 5 patrones:
1. El verbo de delante decide la forma: want + persona + to; hope / I don't think + frase normal (it is, she passes); avoid + -ing; as soon as / provided that + presente.\n2. Preposiciones fijas: insist ON, accuse OF, blame FOR, no point IN, depending ON, since + momento de inicio. Apréndelas como un bloque, sin traducir «en» o «de».\n3. Estructuras C1: Not until… / Not only… + auxiliar + sujeto (did I understand); not only… BUT also.\n4. Un paso atrás en el tiempo: pasiva must be + participio; estilo indirecto: asked what I had done.\n5. Vocabulario que el español confunde: chance (probabilidad) frente a opportunity (ocasión para hacer algo); lend (dar) frente a borrow (recibir); bus stop.\nEn Reading y Listening: desconfía de la opción que repite una palabra del texto y busca el cambio de idea tras although, whereas o moved to.`,items:[
[`The teacher wants us ___ the essay by Monday.`,[`to finish`,`that we finish`,`finish`],0,`Want + persona + to + verbo. «Quiere que lo terminemos» no lleva that en inglés.`,2,'ger'],
[`I don't think the shop ___ open today.`,[`is`,`be`,`being`],0,`I don't think + frase normal: the shop is. En español: «no creo que esté abierta».`,2,'ger'],
[`I hope the train ___ on time.`,[`arrives`,`arrive`,`to arrive`],0,`Hope + frase normal. The train = it, así que lleva -s: arrives. Sin -s es el calco del subjuntivo («que llegue»).`,2,'ger'],
[`He avoided ___ me in the eye.`,[`looking`,`to look`,`look`],0,`Avoid + -ing, aunque en español sea «evitó mirarme».`,2,'ger'],
[`You can use my laptop provided that you ___ careful with it.`,[`are`,`will be`,`be`],0,`Provided that funciona como if: presente, sin will. «Siempre que tengas cuidado».`,2,'cond'],
[`I'll text you as soon as the film ___.`,[`finishes`,`will finish`,`finished`],0,`As soon as + presente, aunque sea futuro: «en cuanto termine».`,2,'cond'],
[`She insisted ___ driving me to the station.`,[`on`,`in`,`to`],0,`Insist ON + -ing. «Insistir en» empuja a in; en inglés es on. Es tu fallo más repetido.`,2,'prep'],
[`They accused him ___ cheating in the exam.`,[`of`,`for`,`with`],0,`Accuse someone OF something.`,2,'prep'],
[`He was blamed ___ the accident.`,[`for`,`of`,`with`],0,`Blame someone FOR something. Accuse va con of; blame, con for.`,2,'prep'],
[`There's no point ___ complaining now; the decision is final.`,[`in`,`on`,`to`],0,`There's no point IN + -ing = no sirve de nada.`,2,'prep'],
[`Opening hours change ___ on the time of year.`,[`depending`,`depend`,`depends`],0,`Depending on = según. Ya hay un verbo (change), así que el segundo va en -ing.`,2,'prep'],
[`I have known her ___ we were at university.`,[`since`,`for`,`from`],0,`Since + momento de inicio (since we were at university). For va con una cantidad de tiempo.`,2,'pp'],
[`Not until I read the letter ___ what had happened.`,[`did I understand`,`I understood`,`understood I`],0,`Not until al principio → auxiliar + sujeto + verbo base: did I understand.`,3,'estr'],
[`Not only ___ the exam, but she also got the highest mark.`,[`did she pass`,`she passed`,`passed she`],0,`Not only al principio → did + sujeto + verbo base.`,3,'estr'],
[`The hotel was not only cheap ___ also very clean.`,[`but`,`and`,`so`],0,`Not only… BUT also. Es una pareja fija: «no solo… sino también».`,2,'con'],
[`He asked me what I ___ the day before.`,[`had done`,`have done`,`did do`],0,`Estilo indirecto: asked (pasado) + un paso atrás → had done. The day before lo confirma.`,2,'preg'],
[`All applications must be ___ online.`,[`submitted`,`submit`,`submitting`],0,`Pasiva: must be + participio. Las solicitudes no envían nada: alguien las envía.`,2,'tiem'],
[`The doctor insisted that he ___ in bed for a week.`,[`stay`,`staying`,`to stay`],0,`Subjuntivo inglés (C1): insist that + verbo base, sin -s. En conversación: he should stay.`,3,'estr'],
[`There's a small ___ that the flight will be delayed.`,[`chance`,`opportunity`,`luck`],0,`Chance = probabilidad. Opportunity es una ocasión para hacer algo tú.`,2,'voc'],
[`This summer job is a great ___ to improve my English.`,[`opportunity`,`luck`,`fortune`],0,`Opportunity to + verbo = ocasión para hacer algo.`,2,'voc'],
[`Could I ___ your umbrella? I'll give it back tomorrow.`,[`borrow`,`lend`,`owe`],0,`Borrow = recibir prestado (el paraguas viene a ti). Lend = dar prestado.`,1,'conf'],
[`Let's meet at the ___ ten minutes before the train leaves.`,[`train station`,`station of train`,`station train`],0,`Train station: el sustantivo que describe va delante, como bus stop.`,1,'orden'],
[`The harder you work, ___ results you will get.`,[`the better`,`better`,`the best`],0,`The + comparativo, the + comparativo. Better es comparativo; the best es superlativo.`,2,'inc'],
[`What does the text suggest?`,[`The cycle lanes did not cause the problems people expected`,`Drivers' journeys have become much slower`,`Critics were right about the cycle lanes`],0,`Although + in fact: lo que pasó es lo contrario de lo previsto. La opción de critics repite una palabra del texto, pero dice lo contrario.`,2,null,`Although critics predicted that the new cycle lanes would cause chaos, journey times for drivers have in fact fallen slightly since they opened.`],
[`Choose the best heading.`,[`A divided opinion on a local plan`,`New jobs for everyone`,`Environmental groups celebrate`],0,`Whereas une dos posturas opuestas: el título habla de división. Las otras opciones toman una palabra del texto (jobs, environment) pero cambian el sentido.`,2,null,`Supporters of the plan say it will create jobs, whereas opponents argue that it will damage the local environment.`]

const SA=`Speaker one: I used to buy coffee on the way to work every single day. When I worked out how much it cost me in a year, I was shocked, so now I make it at home and take it in a flask. Speaker two: For me the key is planning meals. On Sunday evening I decide what we will eat all week and write a shopping list. If something is not on the list, it does not go in the trolley. Speaker three: Honestly, I am terrible with money, so I let my bank do it for me. The day I get paid, a fixed amount moves into a savings account, and I never see it. Speaker four: I cancelled three streaming subscriptions I hardly used. It felt strange at first, but I do not miss them at all, and I read much more now.`;
const SB=`Speaker one: When I moved to Leeds for work, the hardest part was not the job, it was the evenings. I did not know anyone, so I joined a running club, and that changed everything. Speaker two: I had always lived in the countryside, so the noise in the city kept me awake for weeks. These days I hardly notice it. Speaker three: What surprised me most was how expensive everything was. I had to share a flat with three other people, which I had not expected at my age. Speaker four: I chose Edinburgh because of the university, and I have never regretted it. If anything, I wish I had moved there sooner.`;

/* ===== CURVA DEL OLVIDO (por tarea) =====
Modelo exponencial de Ebbinghaus: memoria estimada R = e^(-días desde la última vez / S).
S (estabilidad, en días) empieza en 0,5 + 2 × nota (de 0,5 a 2,5 días).
Cada repetición con nota ≥ 60 %: S × (1,2 + 2 × nota × (1 − R en ese momento)). Repasar cuando ya habías olvidado parte y acertar fortalece más; repetir enseguida casi no suma (efecto del espaciado).
Con nota < 60 %: S se reduce a la mitad.
Toca repasar cuando R < 70 %. Nota esperada al repetir = última nota × R + suelo × (1 − R). El suelo es lo que sabes sin haber practicado esa tarea: tu acierto general en preguntas nuevas, sin superar tu última nota. Así el modelo no supone que olvidas hasta acertar al azar.
Son parámetros generales, no ajustados a la persona: la app guarda cada predicción y la compara con la nota real (D.cal) para medir su error. */

function fcSec(id){const H=D.h.filter(x=>x.id==id&&typeof x.p=='number').sort((a,b)=>a.t-b.t);if(!H.length)return null;let S=0,last=0;for(const x of H){const q=x.p/100;if(!last)S=.5+2*q;else{const R=Math.exp(-((x.t-last)/864e5)/S);S=q>=.6?S*(1.2+2*q*(1-R)):Math.max(.5,S*.5)}last=x.t}
const dt=(Date.now()-last)/864e5,R=Math.exp(-dt/S),pl=H[H.length-1].p,G=D.nw&&D.nw.t>=10?D.nw.o/D.nw.t:.6,fl=Math.min(pl/100,G);return{id,S,R,dt,n:H.length,pl,E:(pl/100)*R+fl*(1-R),due:last+S*Math.log(1/FCT)*864e5}}

$('#dn').onclick=()=>{const n=cnt(),ok=n>=s.min&&n<=s.max;$('#tx').readOnly=true;$('#ev').innerHTML=`<p class="${ok?'good':'bad'}">${ok?'Longitud correcta.':'Te has salido del rango ('+n+' palabras).'}</p><button class=pri id=ai style=width:100%>✨ Corregir con Claude</button><div id=aiout></div><div id=rw style="display:none"><h3>Segunda oportunidad</h3><p class=mut>Reescribe tu texto usando las correcciones de arriba y pulsa Corregir de nuevo. Solo cuenta la última corrección.</p><textarea id=tx2 style=min-height:160px></textarea><button class=pri id=ai2 style=width:100%>✨ Corregir de nuevo</button><div id=aiout2></div></div>${checks(s)}<details><summary>Ver respuesta modelo</summary><p class=ctx style="white-space:pre-line">${s.model}</p></details><button class=pri id=sv style="width:100%">Guardar y terminar</button>`;$('#ai').onclick=()=>{aiFix('w',s,$('#tx').value);$('#rw').style.display='block';$('#tx2').value=$('#tx').value;$('#ai2').onclick=()=>aiFix('w',s,$('#tx2').value,'aiout2')};$('#sv').onclick=()=>fin(score(ok))}}
function fin(p,a){const s=cur.s;D.min=(D.min||0)+Math.min(30,(Date.now()-(cur.t0||Date.now()))/6e4);if(cur.ai){p=cur.ai.p;a=cur.ai.a}if(cur.fe!=null&&typeof p=='number'&&!/^(rev|twin)$/.test(s.id))D.cal=(D.cal||[]).concat([[+cur.fe.toFixed(3),p/100]]).slice(-60);if(a==null&&s.l!=null)a=s.l+(p-60)/100;if(!/^(rev|twin)$/.test(s.id))D.h.push({t:Date.now(),k:s.k,id:s.id,p,a});D.xp+=20;save();const prev=D.h.filter(x=>x.id==s.id).slice(-2,-1)[0];
const msg=p>=80?'¡Gran trabajo! Dominas esta parte.':p>=50?'Buen avance. Repetirla mañana te dará más seguridad.':'Cada intento cuenta. Repasa las explicaciones y vuelve a intentarlo.';
app.innerHTML=`<div class=card style="text-align:center"><h1>${p}%</h1><p>${msg}</p>${(f=>f?`<p class=mut>📈 Según tu curva del olvido, repasa esta tarea ${fcWhen(f)}.</p>`:'')(fcSec(s.id))}${a!=null?`<p>Nivel mostrado en esta tarea: <b>${lab(a)}</b></p>`:''}${prev?`<p class=mut>Intento anterior: ${prev.p}% (${p-prev.p>=0?'+':''}${p-prev.p} puntos)</p>`:'<p class=mut>Primer intento guardado.</p>'}<p class=good>+20 XP por terminar 🎉</p><div class=row><button onclick="run('${s.id}')">Repetir</button><button class=pri onclick="dash()">Ver mi nivel y progreso</button></div><button style="width:100%;margin-top:10px" onclick="home()">Volver al inicio</button></div>`}
function dash(){spKill();const h=D.h;
if(!h.length){app.innerHTML=`<h1>Mi progreso</h1><div class=card><p>Aún no hay datos. Completa tu primera tarea y verás aquí tu evolución.</p><button class=pri onclick="home()">Empezar</button></div>${learnCard()}${bak()}`;return}
const last=h.slice(-20),W=600,H=200,x=i=>30+i*(W-50)/Math.max(last.length-1,1),y=p=>H-20-p*(H-40)/100;
const line=last.map((a,i)=>`${i?'L':'M'}${x(i)},${y(a.p)}`).join(' ');
const col=k=>`var(${K[k][1]})`;
const svg=`<svg viewBox="0 0 ${W} ${H}" role=img aria-label="Evolución de tus resultados">${[0,50,100].map(v=>`<line x1=30 x2=${W-10} y1=${y(v)} y2=${y(v)} stroke="var(--ln)"/><text x=2 y=${y(v)+4} font-size=12 fill="var(--mut)">${v}%</text>`).join('')}<path d="${line}" fill=none stroke="var(--mut)" stroke-width=2 />${last.map((a,i)=>`<circle cx=${x(i)} cy=${y(a.p)} r=6 fill="${col(a.k)}"/>`).join('')}</svg>`;
const rows=Object.keys(K).map(k=>{const v=pk(k),a=avg(v);let d='';if(v.length>=4){const dl=avg(v.slice(-2))-avg(v.slice(0,2));d=` <span class="${dl>=0?'good':'bad'}">${dl>=0?'+':''}${dl} pts desde el inicio</span>`}
return`<div><h3>${K[k][0]} <span class=mut>(${v.length} intentos)</span>${d}</h3><div class=bar><i style="width:${a||0}%;background:${col(k)}"></i></div><span class=mut>${a==null?'Sin datos':'Media: '+a+'%'}</span></div>`}).join('');
const all=avg(h.map(a=>a.p)),rc=avg(h.slice(-5).map(a=>a.p)),f=avg(h.slice(0,5).map(a=>a.p));
app.innerHTML=`<h1>Mi progreso</h1>
${lvCard()}${learnCard()}${fcCard()}<div class="card row"><div class=stat><b>${h.length}</b>tareas</div><div class=stat><b>${all}%</b>media global</div><div class=stat><b>${rc-f>=0?'+':''}${rc-f}</b>pts: últimas 5 vs primeras 5</div></div>
<div class=card><h2>Últimas ${last.length} tareas</h2>${svg}<p class=mut>Cada punto es una tarea; el color indica la destreza. ${Object.keys(K).map(k=>`<span style="color:${col(k)}">●</span> ${K[k][0]}`).join(' · ')}</p></div>
<div class=card><h2>Por destreza</h2>${rows}</div>
<div class=card><h2>Historial</h2>${h.slice(-8).reverse().map(a=>`<p>${new Date(a.t).toLocaleDateString('es-ES')} · ${SECS.find(s=>s.id==a.id).n} · <b>${a.p}%</b></p>`).join('')}</div>
${bak()}<button onclick="if(confirm('¿Borrar todo tu progreso?')){D={h:[],xp:0,srs:{},seen:{},err:{}};save();home()}">Borrar progreso</button>`}
home();

try{if('serviceWorker' in navigator&&window.isSecureContext&&window.top===window.self)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script></body></html>
