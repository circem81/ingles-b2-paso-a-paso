Mixto: If + had + participio, would + verbo (pasado que afecta al presente).
Unless = if not.`,[
[`If I ___ you, I would accept the offer.`,[`am`,`were`,`will be`],1,`En el segundo condicional se usa were con todos los sujetos.`],
[`If she had studied harder, she ___ the exam.`,[`would pass`,`would have passed`,`will pass`],1,`Tercero: would have + participio.`],
[`___ you hurry, you will miss the train.`,[`Unless`,`Otherwise`,`Although`],0,`Unless = if not (si no te das prisa).`],
[`If I had taken the job, I ___ in London now.`,[`would be living`,`would have lived`,`will live`],0,`Mixto: condición en el pasado, resultado en el presente.`],
[`I will lend you the book provided that you ___ it back.`,[`will bring`,`bring`,`brought`],1,`Provided that + presente.`],
[`What ___ if the plane were cancelled?`,[`will you do`,`would you do`,`did you do`],1,`Si la condición usa were, la principal lleva would.`],
[`If I had studied medicine, I ___ a doctor now.`,[`will be`,`would have been`,`would be`],2,`Condicional mixto: causa en el pasado (had studied) y resultado en el presente (would be). La pista es now. En español: si hubiera estudiado medicina, ahora sería médico.`],
[`If she were not so shy, she ___ the job last week.`,[`would get`,`would have got`,`will have got`],1,`Mixto inverso: condición que afecta al presente (were not so shy) y resultado en el pasado (would have got). La pista es last week.`],
[`If I had saved more money last year, I ___ to buy a bigger flat now.`,[`would be able`,`would have been able`,`will be able`],0,`Resultado en el presente (now): would + verbo base. Habría sido sería would have been; sería es would be.`],
[`If you had listened to the instructions, you ___ in trouble now.`,[`would not be`,`would not have been`,`will not be`],0,`Now marca un resultado presente: would not be.`],
[`If he had left earlier, he ___ the train yesterday.`,[`would have caught`,`would catch`,`will catch`],0,`Yesterday marca un resultado pasado: tercer condicional, would have + participio.`],
[`If she had taken the job, she ___ much happier these days.`,[`would be`,`would have been`,`will be`],0,`These days es presente: would be, no would have been.`]]);
G('g2','Pasivas y causativa',`Pasiva: be + participio.
Pasado: was built. Futuro: will be signed. Perfecto: has been applied. Modal: must be done.
Causativa: have / get + objeto + participio (I had my car repaired).
Impersonal: He is said to be… / He is said to have made…`,[
[`The bridge ___ in 1998.`,[`built`,`was built`,`has built`],1,`Pasado pasivo: was + participio.`],
[`The documents ___ by tomorrow.`,[`will be signed`,`will sign`,`are signing`],0,`Futuro pasivo: will be + participio.`],
[`I had my hair ___ yesterday.`,[`cut`,`cutting`,`to cut`],0,`Causativa: have + objeto + participio.`],
[`He is said ___ a fortune.`,[`to have made`,`making`,`that made`],0,`Impersonal: is said to have + participio para el pasado.`],
[`The new rules ___ since January.`,[`have been applied`,`are applying`,`applied`],0,`Present perfect pasivo: have been + participio.`],
[`Nobody likes ___ in public.`,[`laughing at`,`being laughed at`,`to laugh at`],1,`Gerundio pasivo: being + participio.`]]);
G('g3','Estilo indirecto',`Los tiempos retroceden: presente → pasado; pasado → pasado perfecto; will → would; can → could.
Cambian: today → that day; tomorrow → the next day; here → there.
say (sin objeto) / tell (con objeto).
Preguntas: ask + if / whether y sin inversión.`,[
[`She said she ___ tired.`,[`is`,`was`,`has been`],1,`Presente → pasado.`],
[`He told me that he ___ the film the week before.`,[`saw`,`had seen`,`has seen`],1,`Pasado simple → pasado perfecto.`],
[`She asked me ___ I wanted some tea.`,[`that`,`if`,`what if`],1,`Preguntas de sí/no: if o whether.`],
[`He ___ me that the meeting was cancelled.`,[`said`,`told`,`spoke`],1,`Tell lleva objeto directo (told me).`],
[`She said: I will call you tomorrow. → She said she ___ me the next day.`,[`would call`,`will call`,`calls`],0,`will → would y tomorrow → the next day.`],
[`He asked where ___.`,[`did I live`,`I lived`,`do I live`],1,`En indirecto no hay inversión: where I lived.`]]);
G('g4','Modales de deducción y pasado',`must have + participio = seguro que (pasado).
can't have = imposible (pasado).
might / may / could have = quizá.
should have = reproche o consejo sobre el pasado.
needn't have = lo hiciste y no hacía falta.`,[
[`The lights are on. They ___ be at home.`,[`must`,`can't`,`should`],0,`Must = deducción segura.`],
[`He ___ have taken my keys; he was not even here.`,[`must`,`can't`,`might`],1,`Can't have = imposible en el pasado.`],
[`You ___ told me earlier! I could have helped.`,[`must have`,`should have`,`could`],1,`Should have + participio = reproche.`],
[`She did not answer. She ___ asleep.`,[`might have been`,`should be`,`needn't have been`],0,`Might have been = posibilidad en el pasado.`],
[`You ___ bought a gift; it was a casual party.`,[`needn't have`,`mustn't have`,`can't have`],0,`Needn't have + participio: no era necesario.`],
[`They ___ be rich; they live in a tiny flat.`,[`can't`,`must`,`should`],0,`Can't = deducción negativa.`]]);
G('g5','Gerundio e infinitivo',`+ -ing: enjoy, avoid, suggest, mind, consider, finish, keep.
+ to: decide, want, hope, manage, refuse, afford.
Cambian de sentido: remember / forget / stop + -ing (algo pasado) o + to (algo por hacer).
Tras preposición siempre -ing.`,[
[`She avoided ___ about the problem.`,[`to talk`,`talking`,`talk`],1,`Avoid + -ing.`],
[`He managed ___ the exam despite everything.`,[`passing`,`to pass`,`pass`],1,`Manage + to + infinitivo.`],
[`I will never forget ___ the Eiffel Tower for the first time.`,[`seeing`,`to see`,`see`],0,`Forget + -ing = recuerdo de algo que pasó.`],
[`Remember ___ the lights before you leave.`,[`turning off`,`to turn off`,`turn off`],1,`Remember to = no olvidar hacer algo.`],
[`He is interested in ___ a course.`,[`take`,`to take`,`taking`],2,`Preposición + -ing.`],
[`We stopped ___ a coffee on the way.`,[`having`,`to have`,`have`],1,`Stop to + infinitivo = parar para hacer algo.`],
[`Do you fancy ___ out tonight?`,[`eat`,`eating`,`to eat`],1,`Fancy + -ing = apetecer (inglés británico, informal): Do you fancy going out? También va con sustantivo: Do you fancy a coffee?`],
[`I do not feel like ___ out tonight; I am too tired.`,[`going`,`to go`,`go`],0,`Feel like + -ing = tener ganas de. Es muy frecuente en conversación y en Speaking.`],
[`I am looking forward to ___ you next week.`,[`see`,`seeing`,`to see`],1,`Look forward to + -ing. Aquí to es una preposición, no el to del infinitivo.`]]);
G('g6','Conectores y contraste',`Contraste: although / even though + frase; despite / in spite of + sustantivo o -ing; however (nueva frase).
Causa: because + frase; because of + sustantivo.
Consecuencia: so, therefore, as a result.
Finalidad: to, in order to, so that + frase.`,[
[`___ the rain, we went for a walk.`,[`Although`,`Despite`,`However`],1,`Despite + sustantivo.`],
[`___ it was cold, he wore a T-shirt.`,[`In spite of`,`Even though`,`Because of`],1,`Even though + sujeto + verbo.`],
[`She left early ___ she could catch the last train.`,[`so that`,`so as`,`in spite`],0,`So that + sujeto + verbo (finalidad).`],
[`The flight was delayed. ___, we missed the connection.`,[`As a result`,`Although`,`Despite`],0,`As a result = como consecuencia.`],
[`We stayed at home ___ the storm.`,[`because of`,`because`,`although`],0,`Because of + sustantivo.`],
[`He works hard; ___, he never gets promoted.`,[`however`,`therefore`,`because`],0,`However marca contraste entre frases.`],
[`We enjoyed the trip ___ the rain.`,[`in spite of`,`in spite to`,`in spite for`],0,`In spite of + sustantivo (the rain). Siempre lleva of: in spite of. Although se usa con una oración completa: Although it rained.`],
[`Although she was tired, she kept working. = ___ being tired, she kept working.`,[`Despite`,`Despite of`,`Although`],0,`Despite + sustantivo o -ing, y sin of. Despite of es un error muy frecuente.`],
[`___ the fact that it rained, we enjoyed the trip.`,[`In spite of`,`Despite of`,`However`],0,`In spite of the fact that + oración completa. También se puede decir Despite the fact that, sin of.`]]);
G('g7','Oraciones de relativo',`who (personas), which (cosas), whose (posesión), where (lugar).
Definitivas: sin comas, se puede usar that.
No definitivas: entre comas, nunca that.
Formal: preposición + whom / which (the person to whom I spoke).`,[
[`The woman ___ car was stolen called the police.`,[`who`,`whose`,`which`],1,`Whose expresa posesión.`],
[`This is the hotel ___ we stayed last year.`,[`where`,`which`,`who`],0,`Where para lugares.`],
[`My brother, ___ lives in Rome, is a chef.`,[`that`,`who`,`whom`],1,`En relativas no definitivas no se usa that.`],
[`The report, ___ was 50 pages long, took hours to read.`,[`that`,`which`,`what`],1,`Which entre comas.`],
[`The colleague ___ I spoke to is on holiday.`,[`whom`,`whose`,`which`],0,`Whom (formal) como objeto de persona.`],
[`She told me something ___ surprised me.`,[`what`,`that`,`who`],1,`That para cosas tras something.`]]);
G('g8','Wish, if only y would rather',`wish + pasado: deseo sobre el presente (I wish I had more time).
wish + had + participio: lamento del pasado.
wish + would: queja sobre lo que hace otra persona.
would rather + sujeto + pasado: preferencia sobre otros.`,[
[`I wish I ___ more free time.`,[`have`,`had`,`would have`],1,`Wish + pasado para el presente.`],
[`I wish I ___ that email yesterday.`,[`didn't send`,`hadn't sent`,`wouldn't send`],1,`Lamento del pasado: wish + had + participio.`],
[`I wish you ___ so loudly!`,[`wouldn't talk`,`didn't talked`,`don't talk`],0,`Wish + would = queja sobre un hábito ajeno.`],
[`If only I ___ the answer!`,[`know`,`knew`,`would know`],1,`If only + pasado, igual que wish.`],
[`I would rather you ___ smoke here.`,[`don't`,`didn't`,`won't`],1,`Would rather + sujeto + pasado.`],
[`She wishes she ___ to the party last night.`,[`went`,`had gone`,`would go`],1,`Pasado irreal: had + participio.`]]);
G('g9','Tiempos perfectos y continuos',`Present perfect: experiencia o resultado.
Present perfect continuous: duración hasta ahora (I have been working for 3 hours).
Past perfect (continuous): antes de otro hecho pasado.
Future perfect: will have + participio (para una fecha futura).`,[
[`I ___ here for three years.`,[`work`,`have been working`,`am working`],1,`Duración hasta ahora: present perfect continuous.`],
[`She was tired because she ___ all day.`,[`worked`,`had been working`,`has worked`],1,`Causa en el pasado: past perfect continuous.`],
[`By next June, I ___ my degree.`,[`will finish`,`will have finished`,`am finishing`],1,`By + fecha futura: future perfect.`],
[`Why are your eyes red? ___?`,[`Did you cry`,`Have you been crying`,`Do you cry`],1,`Evidencia presente de una acción reciente.`],
[`This is the best film I ___.`,[`ever saw`,`have ever seen`,`had ever seen`],1,`Superlativo + present perfect.`],
[`I ___ him since we were at school.`,[`know`,`have known`,`knew`],1,`Since + present perfect.`],
[`By the time I arrived, the meeting ___ already finished.`,[`had`,`has`,`have`],0,`Past perfect: la reunión terminó antes de que llegaras. En español es había terminado. Has/have conectan con el presente y aquí hablamos de dos momentos del pasado.`],
[`When we got to the cinema, the film ___ already started.`,[`had`,`has`,`would`],0,`Dos hechos pasados: el anterior va en past perfect (had started), el posterior en pasado simple (got).`],
[`She ___ already left when I called her.`,[`had`,`has`,`was`],0,`Had + participio para la acción anterior: ya se había ido cuando la llamé.`],
[`I ___ already finished my homework, so I can go out now.`,[`have`,`had`,`was`],0,`Aquí el resultado afecta al presente (can go out now): present perfect con have. Compara con las preguntas anteriores, que son dos momentos del pasado.`]]);
G('g10','Comparativos y cuantificadores',`the + comparativo, the + comparativo (the more, the better).
as… as; twice as… as.
few / little (casi nada, negativo) frente a a few / a little (algo).
adjetivo + enough; too + adjetivo.
by far + superlativo.`,[
[`The more you practise, ___ you become.`,[`better`,`the better`,`the best`],1,`The + comparativo, the + comparativo.`],
[`There are ___ seats left, so hurry!`,[`a little`,`few`,`much`],1,`Few = muy pocos con contables.`],
[`This laptop is twice ___ expensive as that one.`,[`more`,`as`,`than`],1,`Twice as + adjetivo + as.`],
[`He is not tall ___ to reach the shelf.`,[`too`,`enough`,`very`],1,`Adjetivo + enough.`],
[`We have ___ time; let's take a taxi.`,[`little`,`a few`,`many`],0,`Little + incontable = casi nada.`],
[`She is ___ the most talented singer in the group.`,[`by far`,`much more`,`far than`],0,`By far + superlativo.`]]);

SP('s7','Speaking 7 · Un viaje memorable',1,`Describe a memorable trip. Where did you go, who with and what happened?`,45,'Usa pasado: went, saw, was. Orden: dónde, con quién, qué pasó, cómo te sentiste.',`Last summer I went to Italy with my sister. We visited Rome and ate delicious pizza. It was unforgettable because we laughed all the time.`);
SP('s8','Speaking 8 · Describe una foto',2,`Imagine a photo of a family having a picnic in a park. Describe what you can see, what they might be feeling, and say whether you enjoy picnics.`,45,'Usa: In the picture I can see…, They look…, They might be…',`In the picture I can see a family sitting on a blanket. They look relaxed and happy. They might be celebrating a birthday. I enjoy picnics because I love being outdoors.`);
SP('s9','Speaking 9 · Compara dos medios',2,`Compare travelling by car and by train. Which do you prefer and why?`,45,'Compara con: whereas, while, on the other hand, more convenient than.',`Travelling by car is more flexible, whereas the train is more relaxing. On the other hand, driving can be stressful. I prefer the train because I can read.`);
SP('s10','Speaking 10 · Tecnología y vida',2,`Do you think technology has made our lives easier or more complicated? Give reasons and examples.`,120,'Estructura: opinión, dos argumentos con ejemplo, matiz, conclusión.',`In my view technology has made life easier, as we can work and study from home. However, it can be distracting. On balance, it is beneficial if used wisely.`);
SP('s11','Speaking 11 · Educación (debate)',3,`Should university education be free for everyone? Discuss both sides and give your opinion.`,120,'Usa: Proponents argue that…, Opponents claim…, To my mind…',`Proponents argue that free education promotes equal opportunities. Opponents claim that it burdens taxpayers. To my mind, a mixed system with grants is fairest.`);
SP('s12','Speaking 12 · Turismo (C1)',3,`Some people say that tourism damages the places it depends on. To what extent do you agree?`,120,'C1: To a large extent…, It could be argued that…, Not only… but also…',`To a large extent I agree: mass tourism strains local resources. Nevertheless, it could be argued that it funds conservation. Ultimately, regulation is the key.`);
WR('w6','Writing 6 · Email a un amigo',1,40,50,`A friend invites you to a birthday party but you cannot go. Write an informal email (40-50 words): apologise, explain why and suggest meeting later.`,`Hi Sam, thanks so much for the invitation! Unfortunately I can't come because I have to work that weekend. I'm really sorry. How about having dinner next week to celebrate? Let me know what suits you. Take care!`);
WR('w7','Writing 7 · Reclamación formal',2,120,150,`You bought a laptop online but it arrived damaged. Write a formal email to customer services (120-150 words): explain the problem, say how you feel and ask for a solution.`,`Estructura: Dear Sir or Madam, → I am writing to complain about… (pedido, fecha) → The laptop arrived with… I am extremely disappointed because… → I would be grateful if you could replace it or refund me… → I look forward to your reply. Yours faithfully,`);
WR('w8','Writing 8 · Solicitud de empleo',2,120,150,`You see a job advertisement for a customer service assistant. Write a formal email applying for the job (120-150 words): mention your experience, your skills and when you are available.`,`Estructura: Dear Mr or Ms… → I am writing to apply for the position of… → Experience: I have worked as… for… years → Skills: I am organised and fluent in… → Availability: I could start on… → I attach my CV and look forward to hearing from you. Yours sincerely,`);
WR('w9','Writing 9 · Informal: tu ciudad',1,40,50,`Write to an English friend about the town or city where you live (40-50 words): what you like, what you do there and invite them to visit.`,`Hi Emma! I live in a lovely small town in the south of Spain. I like the warm weather and the friendly people. At weekends I walk by the river and try local food. You should visit me in spring; it is beautiful!`);
WR('w10','Writing 10 · Carta al director (C1)',3,150,180,`Write a letter to a newspaper editor (150-180 words) giving your views on whether schools should ban mobile phones. Present both sides and conclude with your opinion.`,`Estructura: Dear Editor, → Motivo de la carta → A favor (distracción, bienestar) → En contra (emergencias, uso educativo) → Opinión: On balance, I believe… → Yours faithfully. Conectores: Admittedly, Nevertheless, Moreover, Consequently.`);

[`By the time she retires, she ___ for the company for forty years.`,[`will work`,`will have been working`,`has worked`],1,`Future perfect continuous: duración hasta un momento futuro.`,2],
[`I would rather you ___ anything to him about it yet.`,[`didn't say`,`don't say`,`wouldn't say`],0,`Would rather + sujeto + pasado: preferencia sobre lo que haga otro.`,2],
[`She denied ___ the money, although the evidence was clear.`,[`to take`,`having taken`,`take`],1,`Deny + -ing; el perfecto (having taken) marca una acción anterior.`,2],
[`It was only after the meeting ___ I realised the mistake.`,[`that`,`when`,`which`],0,`Oración hendida: It was only after… that…`,2],
[`If it had not been for your help, I ___ the project.`,[`would not finish`,`would not have finished`,`will not have finished`],1,`If it hadn't been for + tercer condicional.`,2],
[`He is said ___ the best surgeon in the country.`,[`being`,`to be`,`that is`],1,`Pasiva impersonal: is said to be.`,2],
[`We insisted ___ paying for the meal.`,[`in`,`on`,`at`],1,`Insist on + -ing.`,2],
[`The new policy is bound ___ unpopular with young voters.`,[`being`,`to be`,`be`],1,`Be bound to + infinitivo = seguro que ocurrirá.`,2],
[`Having ___ the report, she sent it to her manager.`,[`finished`,`finish`,`to finish`],0,`Having + participio: acción terminada antes de otra.`,2],
[`There is no point ___ to persuade him; he never changes his mind.`,[`in trying`,`to try`,`on trying`],0,`There is no point in + -ing.`,2],
[`Her ___ to the cause inspired the whole team.`,[`commitment`,`committal`,`committing`],0,`Commitment = compromiso (formación de palabras).`,2],
[`The scandal had a ___ effect on the party's reputation.`,[`damaging`,`damaged`,`damage`],0,`Damaging = perjudicial (adjetivo antes del sustantivo).`,2],
[`They managed to ___ the deadline despite the delays.`,[`meet`,`touch`,`reach`],0,`Colocación: meet a deadline.`,2],
[`I could not help ___ when I heard the joke.`,[`laughing`,`to laugh`,`laugh`],0,`Can't help + -ing = no poder evitar.`,2],
[`Hardly had I sat down ___ the phone rang.`,[`than`,`when`,`that`],1,`Hardly… when (no than) + inversión.`,3],
[`No sooner had we arrived ___ it started to rain.`,[`when`,`than`,`that`],1,`No sooner… than.`,3],
[`Not until the guests had left ___ the washing up.`,[`she started`,`did she start`,`started she`],1,`Not until + inversión auxiliar-sujeto en la principal.`,3],
[`Were it not for the funding, the project ___.`,[`would collapse`,`collapsed`,`had collapsed`],0,`Were it not for = If it weren't for (segundo condicional).`,3],
[`It is essential that every student ___ the form by Friday.`,[`submits`,`submit`,`submitted`],1,`Subjuntivo mandativo: infinitivo sin to para todas las personas.`,3],
[`The more carefully you plan, ___ mistakes you will make.`,[`fewer`,`the fewer`,`less`],1,`The + comparativo, the + comparativo; fewer con contables.`,3],
[`It was not until 1990 ___ the company became profitable.`,[`when`,`that`,`which`],1,`Oración hendida: It was not until… that…`,3],
[`She spoke as if she ___ the answer, but she was bluffing.`,[`knows`,`knew`,`had known`],1,`As if + pasado para algo irreal en el presente.`,3],
[`The manager, along with her assistants, ___ attending the conference.`,[`are`,`is`,`were`],1,`La concordancia es con el sujeto principal (the manager), no con along with.`,3],
[`Little ___ he know that the decision would change his life.`,[`did`,`does`,`had`],0,`Inversión tras adverbios negativos (Little, Rarely, Seldom).`,3],
[`I would have called you if I ___ your number.`,[`had had`,`would have had`,`have had`],0,`Tercer condicional: if + had + participio (had had).`,3],

[`He was ___ of stealing, but later cleared.`,[`accused`,`charged`,`blamed`],0,`Accuse someone of; charge someone with; blame someone for.`,3],

function chRun(){spKill();const d=CHD(),now=Date.now(),q=CH.filter(c=>d[c[0]]&&d[c[0]].due<=now).slice(0,5),nw=CH.filter(c=>!d[c[0]]);let k=0;while(q.length<5&&k<2&&nw.length){q.push(nw.shift());k++}

document.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const g=b.textContent==c[4];document.querySelectorAll('.op').forEach(x=>{x.disabled=true;if(x.textContent==c[4])x.classList.add('good');else if(x==b)x.classList.add('wrong')});$('#fb').innerHTML=`<p class=${g?'good':'bad'}>${g?'Correcto':'Casi. Era: '+c[4]}</p><p>${c[2]}</p><button class=pri id=nx>Siguiente</button>`;$('#nx').onclick=()=>chNext(g)})}
else{const pr=ph=='p'?`Reescribe esta idea usando <b>${c[0]}</b>`:`Responde en voz alta y luego escríbelo, usando <b>${c[0]}</b>`,tx=ph=='p'?c[7]:c[8];

G('g12','Vocabulario B2–C1 frecuente',`Palabras que suelen fallarse:
focus group = grupo de discusión (estudio de mercado)
target audience = público objetivo
annoying = molesto
quaint = pintoresco, atractivo por ser peculiar o antiguo
mainstream = convencional, aceptado por la mayoría
ubiquitous = omnipresente, que está en todas partes
tasteful = de buen gusto
relevant = pertinente, relacionado con el tema
outline = esquema, los puntos principales
tip = punta, consejo o propina
rate = tasa, ritmo o velocidad
boost = impulsar, aumentar
straighten = enderezar
raise = plantear un tema para que se considere
forsake = abandonar (formal)`,[
[`The tourists loved the ___ little village with its cobbled streets and old stone houses.`,[`quaint`,`ubiquitous`,`mainstream`],0,`Quaint = pintoresco, atractivo por ser peculiar o antiguo.`],
[`Smartphones are ___ these days: you see them everywhere.`,[`ubiquitous`,`quaint`,`tasteful`],0,`Ubiquitous = omnipresente, que está en todas partes.`],
[`The band started as an underground group but is now completely ___.`,[`mainstream`,`annoying`,`relevant`],0,`Mainstream = convencional, aceptado por la mayoría.`],
[`The room was decorated in a simple and ___ way, with no unnecessary details.`,[`tasteful`,`annoying`,`ubiquitous`],0,`Tasteful = de buen gusto.`],
[`Could you give me a quick ___ of the main points before the meeting?`,[`outline`,`rate`,`tip`],0,`Outline = esquema o resumen de los puntos principales.`],
[`The government wants to ___ exports to improve the economy.`,[`boost`,`forsake`,`straighten`],0,`Boost = impulsar, aumentar o mejorar algo.`],
[`She decided to ___ the issue at the next meeting.`,[`raise`,`straighten`,`forsake`],0,`Raise an issue = plantear un asunto para que se considere.`],
[`He refused to ___ his principles, even when it cost him his job.`,[`forsake`,`boost`,`straighten`],0,`Forsake = abandonar; es formal y se usa con principios, personas o creencias.`],
[`The unemployment ___ fell to eight per cent last year.`,[`rate`,`tip`,`outline`],0,`Rate = tasa o índice (también ritmo o velocidad).`],
[`The waiter left a generous ___ on the table.`,[`tip`,`rate`,`outline`],0,`Tip = propina; también significa consejo o la punta de algo.`],
[`Please ___ the picture on the wall; it is crooked.`,[`straighten`,`boost`,`raise`],0,`Straighten = enderezar, poner recto.`],
[`Your comments are not ___ to the topic of this meeting.`,[`relevant`,`relative`,`relieved`],0,`Relevant = pertinente, relacionado con el tema. No lo confundas con relative (relativo).`],
[`It was a very ___ noise that kept me awake all night.`,[`annoying`,`tasteful`,`quaint`],0,`Annoying = molesto, irritante.`],
[`Before launching the app, the company asked a small ___ group what they thought of it.`,[`target`,`focus`,`sample`],1,`Focus group = grupo de discusión: un grupo reducido al que se pregunta su opinión sobre un producto. Target = objetivo (target audience, público objetivo). Sample = muestra de personas o productos para un estudio.`],
[`The advert is aimed at a young ___ audience.`,[`target`,`focus`,`sample`],0,`Target audience = público objetivo, a quien va dirigido un anuncio o producto.`],
[`We tested the new product on a ___ of two hundred customers.`,[`sample`,`target`,`focus`],0,`Sample = muestra: un grupo representativo de personas o productos que se estudia.`],
[`The boy ___ through the dirty window, trying to see who was inside.`,[`stared`,`peered`,`glanced`],1,`Peer = mirar con esfuerzo para ver algo lejano o poco visible, como por un telescopio. Stare = mirar fijamente, sin el matiz de esfuerzo; también admite through (stared through the window). Glance = una mirada rápida, lo contrario de intentar ver con detalle.`],
[`She ___ into the darkness, trying to see the road.`,[`peered`,`glanced`,`winked`],0,`Peer into = mirar con esfuerzo hacia algo oscuro o lejano.`],
[`He ___ at his phone and then went back to the meeting.`,[`glanced`,`peered`,`gazed`],0,`Glance at = echar un vistazo rápido.`]]);
G('g13','Very, much y a lot: intensificar',`very + adjetivo normal: very cold, very tired.
Con comparativos no se usa very: much colder, far better, a lot more expensive.
Los adjetivos extremos (freezing, exhausted, fantastic) no admiten very: absolutely freezing, utterly exhausted, really fantastic.
much, many y a lot (of) acompañan a sustantivos o verbos, no a un adjetivo solo: very cold, no much cold.
too + adjetivo = demasiado: far too young.`,[
[`It was ___ cold this morning; I needed a thick coat.`,[`very`,`much`,`many`],0,`Very + adjetivo. Much y many no modifican a un adjetivo solo.`],
[`This laptop is ___ faster than my old one.`,[`very`,`much`,`too`],1,`Con comparativos se usa much, far o a lot; very no se usa.`],
[`The film was ___ fantastic; I loved every minute.`,[`very`,`absolutely`,`much`],1,`Fantastic es un adjetivo extremo: va con absolutely, utterly o really, no con very.`],
[`After the marathon, we were ___ exhausted.`,[`very`,`utterly`,`many`],1,`Exhausted ya es extremo: utterly o absolutely exhausted.`],
[`There is not ___ traffic in the city centre today.`,[`much`,`very`,`many`],0,`Much + sustantivo incontable, sobre todo en negativas y preguntas.`],
[`He is ___ too young to drive.`,[`far`,`very`,`many`],0,`Far too + adjetivo = demasiado. Very too no existe.`]]);

G('g15','Subjuntivo en español, indicativo en inglés',`El subjuntivo es la forma del verbo que el español usa para lo que NO afirmas como un hecho: deseos, dudas, emociones, finalidades, futuros con «cuando» y situaciones imaginarias (que vengas, que sea, si tuviera).
Truco para reconocerlo: si puedes poner «ojalá» delante, es subjuntivo.

El inglés casi no tiene subjuntivo. Cambia cada caso por una fórmula:
1. Quiero / te pido que vengas → want, would like, ask, tell + persona + to + verbo (I want you to come).
2. Espero que / me alegra que / no creo que / dudo que → frase normal (I hope you pass. I'm glad you are here. I don't think it is easy).
3. Cuando / hasta que / en cuanto + futuro → when, until, as soon as + presente (When you arrive, call me).
4. Si tuviera…, viajaría → if + pasado, would + verbo (If I had time, I would travel). Ojalá hiciera… → I wish it were…
5. Para que lo entiendas → so that + frase normal (so that you understand). En pasado: so that + would / could.

Lo poco que sí tiene el inglés (C1): If I were you…, y verbo base tras suggest, recommend o insist that (She recommended that he get some rest).
La negación va en think: I don't think…, no en el segundo verbo.`,[
[`I do not think that he ___ the answer.`,[`knows`,`know`,`knowing`],0,`Tras think (incluso en negativa) se usa indicativo: he knows, con -s. En español sería no creo que sepa.`],
[`I want you ___ to the meeting.`,[`to come`,`come`,`that you come`],0,`Want + persona + to + verbo. No se usa that, a diferencia del español (quiero que vengas).`],
[`I hope that she ___ the exam tomorrow.`,[`passes`,`pass`,`passing`],0,`Tras hope va indicativo: I hope she passes. En español, espero que apruebe lleva subjuntivo; en inglés no.`],
[`I doubt that he ___ on time.`,[`will arrive`,`arrive`,`to arrive`],0,`Tras doubt va indicativo: I doubt he will arrive. En español, dudo que llegue.`],
[`My boss wants me ___ the report today.`,[`to finish`,`finish`,`that I finish`],0,`Want + persona + to + verbo, no that + subjuntivo.`],
[`Do you want me ___ you a lift?`,[`to give`,`give`,`that I give`],0,`Want + persona + to + verbo: Do you want me to give you a lift?`],
[`I do not think this ___ a good idea.`,[`is`,`be`,`being`],0,`La negación va en think y el segundo verbo sigue en indicativo: I don't think this is. En español: no creo que sea.`]]);

SECS.push({id:'gf1',k:'gv',top:1,n:'Verbo + -ing o to (Fase 1: reconocer)',m:4,t:'mc',len:8,les:`Hay dos decisiones separadas: 1) el tiempo del verbo principal (enjoy, enjoyed, will enjoy) y 2) la forma del segundo verbo. La forma la decide el verbo que va antes, no el segundo verbo.\n\nGrupo 1, siempre -ing: enjoy, avoid, finish, suggest, keep, mind, practise.\nGrupo 2, to + infinitivo: want, hope, decide, need, afford, manage, plan.\nGrupo 3, ambas formas con el mismo sentido: like, love, hate, prefer, start, begin, continue.\nGrupo 4, ambas formas pero cambia el sentido: remember, forget, stop, try, regret. De este grupo nos ocupamos más adelante.\n\nLa lógica (una tendencia, no una regla al 100 %):\n• to mira hacia algo que todavía no ha pasado, un objetivo: want to, hope to, decide to, plan to.\n• -ing habla de la actividad en sí, algo que ya existe o que vives: enjoy reading, finish writing, avoid driving.\n• Por eso like y love admiten -ing (la actividad que disfrutas: I love swimming), y would like va con to (un deseo para el futuro: I would like to swim).\n• Hay que memorizar algunas excepciones: suggest y consider van con -ing aunque miren al futuro.\n\nOjo con hope: no se parece a like. Like = disfrutar de una actividad; hope = esperar algo futuro. Si eres tú quien lo hará: hope to + verbo (I hope to pass). Si es otra persona: hope + frase completa (We hope you enjoy your stay). Nunca hope + -ing.\n\nFase 1: solo grupos 1 y 2.`,items:[

G('g17','Vocabulary B2: refuerzo',`Palabras B2 de uso frecuente. Fijate en el contexto: casi siempre la palabra correcta es la que encaja con el sustantivo o la colocación.
achieve = conseguir (un objetivo)
attempt = intento, intentar
deliberate = intencionado
evidence = pruebas, evidencia (incontable)
feasible = viable, factible
genuine = auténtico, sincero
hazard = peligro, riesgo
impose = imponer
obtain = obtener
recover = recuperarse
substantial = considerable, importante`,[
[`The company hopes to ___ its goals by the end of the year.`,[`achieve`,`attempt`,`evidence`],0,`Achieve = conseguir un objetivo o meta. Attempt es intento, no conseguir.`],
[`The police found strong ___ linking him to the crime.`,[`evidence`,`evidences`,`feasible`],0,`Evidence es incontable: no se dice evidences ni an evidence.`],
[`The plan seemed ___ once we had the funding.`,[`feasible`,`genuine`,`hazard`],0,`Feasible = viable, que se puede hacer.`],
[`His apology did not sound ___; he was clearly not sorry.`,[`genuine`,`deliberate`,`substantial`],0,`Genuine = sincero, auténtico. Deliberate significa intencionado, algo distinto.`],
[`The government may ___ new taxes on imported goods.`,[`impose`,`obtain`,`recover`],0,`Impose = imponer (impuestos, normas, sanciones).`],
[`You need a licence to ___ a permit for this work.`,[`obtain`,`achieve`,`impose`],0,`Obtain = obtener algo que se consigue con un proceso, como un permiso.`],
[`It took him two years to ___ from the injury.`,[`recover`,`obtain`,`attempt`],0,`Recover = recuperarse (de una enfermedad o lesión).`],
[`Workers near the factory face a serious ___ from the chemicals.`,[`hazard`,`evidence`,`attempt`],0,`Hazard = peligro, riesgo.`],
[`The company made a ___ investment in new technology.`,[`substantial`,`genuine`,`deliberate`],0,`Substantial = considerable, importante. Se usa con cantidades: a substantial amount.`]]);
G('g18','Writing: conectores de contraste, causa y consecuencia',`Para subir Writing, cambia los conectores repetidos (and, but, so) por estos.
Contraste: however, nevertheless, despite + sustantivo, although + oración. However y nevertheless van tras punto o punto y coma, con coma después.
Añadir ideas: furthermore, moreover, in addition.
Consecuencia: therefore, as a result, consequently.
Alternativa a consecuencia negativa: otherwise (si no, de lo contrario).
Regla: después de despite va sustantivo o -ing, nunca una oración. Para una oración usa although o even though.`,[
[`The new library is modern. ___, it is too far from the centre for most students.`,[`However`,`Furthermore`,`Therefore`],0,`Contraste entre moderna y lejos: However.`],
[`Public transport is cheaper. ___, it reduces traffic and pollution.`,[`Furthermore`,`Although`,`Despite`],0,`Añade otra ventaja: Furthermore. Although y Despite no encajan aquí: tras un punto, para sumar una idea se usa un conector de adición.`],
[`Prices have risen sharply. ___, many families cannot afford basic food.`,[`As a result`,`Nevertheless`,`In spite of`],0,`Consecuencia de la subida: As a result. In spite of necesita un sustantivo después.`],
[`___ the advantages, remote work can be isolating for some employees.`,[`Despite`,`However`,`Although`],0,`Despite + sustantivo (the advantages). However no va en esa posición.`],
[`The council should act now. ___, delays will cost much more in the long run.`,[`Otherwise`,`Moreover`,`However`],0,`Otherwise = si no, de lo contrario: la consecuencia negativa de no actuar.`],
[`The results were not conclusive. ___, further research is needed.`,[`Consequently`,`Nevertheless`,`Meanwhile`],0,`Consecuencia de que no sean concluyentes: Consequently.`],
[`Although it is expensive, the scheme could save many lives. ___, it should be introduced.`,[`Therefore`,`Although`,`Despite`],0,`Conclusión a partir de lo anterior: Therefore.`],
[`___ it might seem difficult, the course is worth the effort.`,[`Although`,`Despite`,`However`],0,`Although + oración completa (it might seem difficult).`]]);
G('g19','Writing: colocaciones frecuentes',`Las colocaciones son combinaciones fijas de palabras. Un error de colocación se nota mucho en Writing, aunque la gramática sea correcta.
take measures / steps (tomar medidas)
make a decision (tomar una decisión)
do your best (hacer lo posible)
have a significant impact on (tener un impacto importante en)
hold the view that (sostener la opinión de que)
rise / rise sharply (subir; subir bruscamente)
meet expectations (cumplir las expectativas)
Usa el diccionario de colocaciones (Oxford Collocations) para comprobar combinaciones nuevas.`,[
[`The government must ___ measures to reduce pollution.`,[`take`,`do`,`make`],0,`Take measures es la colocación correcta.`],
[`We need to ___ a decision before the deadline.`,[`make`,`do`,`take`],0,`Make a decision. Take a decision no es la forma habitual.`],
[`The school ___ its best to help every student.`,[`does`,`makes`,`takes`],0,`Do your best (hacer lo posible).`],
[`This policy will have a ___ impact on young people.`,[`significant`,`much`,`fine`],0,`Significant impact: impacto importante. Much no se usa con impact.`],
[`Many people ___ the view that cities are too crowded.`,[`hold`,`keep`,`carry`],0,`Hold a view (sostener una opinión).`],
[`Standards of living have ___ over the last decade.`,[`risen`,`raised`,`arisen`],0,`Rise es intransitivo: have risen (sin objeto). Raise necesita objeto: raise prices.`],
[`The new product failed to ___ customers' expectations.`,[`meet`,`reach`,`fit`],0,`Meet expectations = cumplir las expectativas.`],
[`Unemployment has ___ sharply since the crisis began.`,[`risen`,`raised`,`rose`],0,`Risen con have. Rose es pasado simple, no sirve con has o have.`]]);
G('g20','Writing: registro formal',`En una carta o un email formal evita las expresiones coloquiales y usa estructuras más cuidadas.
I would be grateful if you could… (te agradecería que…)
I am writing to complain about / to enquire about / to apply for…
Please let me know…
I look forward to hearing from you (preposición to + -ing).
Evita: get, kids, a lot of, stuff, I think it's cool, Hi there, Thanks a lot!`,[
[`I would be ___ if you could send me the details.`,[`grateful`,`chuffed`,`fed up`],0,`I would be grateful if you could. Chuffed y fed up son informales.`],
[`I am writing to ___ about the faulty product I received.`,[`complain`,`moan`,`whinge`],0,`Complain about es formal y neutro. Moan y whinge son informales.`],
[`Please ___ me know as soon as possible.`,[`let`,`make`,`do`],0,`Let me know: forma estándar en emails.`],
[`I look forward ___ hearing from you.`,[`to`,`for`,`at`],0,`Look forward to + -ing. Aquí to es preposición.`]]);
G('g21','Futuro: will, going to, presente continuo, futuro perfecto',`Will: decisiones en el momento, promesas, predicciones sin pruebas.
Going to: planes o predicciones con pruebas (look at those clouds, it is going to rain).
Presente continuo: planes ya organizados (I am meeting her tomorrow).
Presente simple: horarios (the train leaves at nine).
Futuro continuo: will be + -ing, una acción en curso en un momento futuro.
Futuro perfecto: will have + participio, una acción terminada antes de un momento futuro (by next June).`,[
[`Look at those clouds. It ___ rain.`,[`will rain`,`is going to rain`,`rains`],1,`Going to: predicción con pruebas visibles (las nubes).`],
[`I promise I ___ you at seven tomorrow.`,[`will call`,`am calling`,`call`],0,`Will para promesas.`],
[`The train ___ at 9:15 tomorrow morning.`,[`leaves`,`will leave`,`is leaving`],0,`Horario fijo: presente simple.`],
[`I ___ dinner with my parents tonight, so I cannot come.`,[`am having`,`will have`,`have`],0,`Plan ya organizado: presente continuo.`],
[`By next year, she ___ in this company for ten years.`,[`will work`,`will have worked`,`is working`],1,`Futuro perfecto: acción terminada antes de un momento futuro (by next year).`],
[`This time next week, I ___ on a beach in Greece.`,[`will be lying`,`will lie`,`lie`],0,`Futuro continuo: una acción en curso en un momento futuro (this time next week).`],
[`The meeting ___ by the time you arrive.`,[`will have started`,`will start`,`is starting`],0,`Futuro perfecto con by the time: el inicio ocurre antes de tu llegada.`],
[`We ___ married in June. The date is already booked.`,[`are getting`,`will get`,`get`],0,`Presente continuo para planes organizados.`]]);
G('g22','Used to, would, be used to, get used to',`Used to + verbo base: hábitos del pasado que ya no ocurren (I used to smoke).
Would: hábitos del pasado, pero no para estados (I would play as a child, pero no I would live there).
Be used to + -ing: estar acostumbrado (I am used to waking up early).
Get used to + -ing: acostumbrarse (it takes time to get used to it).
Negativa y pregunta de used to: didn't use to / did you use to, con use sin d.`,[
[`I ___ play football every weekend when I was a child.`,[`used to`,`am used to`,`am used`],0,`Used to para hábitos pasados.`],
[`I ___ getting up early, so it is not a problem for me.`,[`am used to`,`used to`,`am use`],0,`Be used to + -ing: estar acostumbrado.`],
[`She ___ living alone; she moved there only last month.`,[`isn't used to`,`didn't use to`,`doesn't use to`],0,`Be used to: estar acostumbrado. Ahora no lo está porque es nuevo.`],
[`Did you ___ travel by train when you were young?`,[`use to`,`used to`,`used`],0,`Pregunta de used to: did + sujeto + use to (sin d).`],
[`It took me months to ___ the cold weather.`,[`get used to`,`get used`,`be used to`],0,`Get used to + sustantivo o -ing.`],
[`I ___ in London, but now I live in Madrid.`,[`used to live`,`use to live`,`am used to living`],0,`Used to para una situación pasada que ya no existe.`],
[`He ___ speak French fluently, but he has forgotten most of it.`,[`used to`,`was used to`,`uses to`],0,`Used to para algo que era cierto antes.`],
[`They ___ with a lot of noise, but they have got used to it now.`,[`are used to living`,`used to living`,`use to live`],0,`Be used to + -ing: estar acostumbrado a vivir con ruido.`]]);
G('g23','Artículos: a, an, the y cero',`A / an: primera mención o algo no concreto (a doctor). An delante de sonido vocal (an engineer, an hour).
The: algo concreto o conocido, superlativos (the best), ríos, mares y países plurales (the Amazon, the Netherlands).
Cero: sustantivos en general (water is essential), idiomas, deportes, comidas en sentido general (I like football).
Instrumentos musicales: the piano, the guitar.`,[
[`She is ___ best doctor in the hospital.`,[`the`,`a`,`an`],0,`Superlativo: the best.`],
[`___ water is essential for life.`,[`Water`,`The water`,`A water`],0,`Sustancia en sentido general: sin artículo.`],
[`He is ___ engineer, and his wife is a teacher.`,[`an`,`a`,`the`],0,`An delante de vocal: an engineer.`],
[`___ Amazon is the largest river in the world.`,[`The`,`An`,`A`],0,`Ríos: siempre the.`],
[`We stayed in ___ hotel near the station.`,[`a`,`the`,`an`],0,`Primera mención de un hotel cualquiera: a hotel.`],
[`She plays ___ piano very well.`,[`the`,`a`,`zero`],0,`Instrumentos musicales: the piano.`],
[`___ children need more sleep than adults.`,[`Children`,`The children`,`A children`],0,`Afirmación general sobre niños: sin artículo.`],
[`I am going to ___ university next year.`,[`go to`,`go to the`,`go to a`],0,`Ir a la universidad como institución: go to university, sin artículo.`]]);
G('g24','Modales: obligación, prohibición, consejo y deducción',`Must / mustn't: obligación y prohibición (you mustn't smoke here).
Don't have to: no hace falta (you don't have to come).
Should / ought to: consejo.
Had better: consejo fuerte, con consecuencias (you had better leave).
Must (be): deducción segura. Might / could: posibilidad.
Must have / might have / should have: deducción o crítica sobre el pasado.`,[
[`You ___ smoke here. It is strictly forbidden.`,[`mustn't`,`don't have to`,`needn't`],0,`Mustn't = prohibición. Don't have to = no es necesario.`],
[`You ___ wear a uniform today. It is optional.`,[`don't have to`,`mustn't`,`shouldn't`],0,`Don't have to: no hay obligación.`],
[`You ___ see a doctor. Your cough has lasted a month.`,[`should`,`must`,`might`],0,`Consejo: should.`],
[`The lights are on, so she ___ be at home.`,[`must`,`mustn't`,`should`],0,`Deducción segura: must + verbo base.`],
[`He ___ have left already; his car is not in the car park.`,[`must`,`must not`,`should be`],0,`Deducción: must + verbo base, aquí el resultado es presente.`],
[`You ___ have told me earlier! I could have helped.`,[`should have`,`must have`,`should be`],0,`Should have + participio: crítica sobre el pasado.`],
[`They ___ be tired after such a long journey.`,[`might`,`must have`,`should have`],0,`Posibilidad en presente: might + verbo base.`],
[`You ___ bring a jacket. It is going to be cold tonight.`,[`had better`,`must not`,`might have`],0,`Had better: consejo fuerte. También puedes decir you'd better bring.`]]);
G('g25','Estilo indirecto avanzado',`Presente → pasado, pasado → pasado perfecto, will → would, can → could, may → might.
Preguntas de sí/no: if o whether. Preguntas con palabra: wh- + sujeto + verbo, sin inversión.
Ordenes: told / asked + objeto + (not) to + verbo.
Sugerencias: suggested + -ing o suggested that + sujeto + should.
Además, cambian expresiones de tiempo y lugar: today → that day, tomorrow → the next day, here → there.`,[
[`He said, "I am tired." → He said that he ___ tired.`,[`was`,`is`,`had been`],0,`Presente → pasado simple.`],
[`She said, "I will call you tomorrow." → She said she ___ me the next day.`,[`would call`,`will call`,`called`],0,`Will → would.`],
[`He asked me where I ___.`,[`lived`,`live`,`did live`],0,`Sin inversión en el estilo indirecto: where I lived.`],
[`She told me ___ that.`,[`not to touch`,`not touch`,`don't touch`],0,`Told + objeto + not to + verbo.`],
[`He asked ___ I had finished the report.`,[`if`,`that`,`what`],0,`Pregunta de sí o no: if o whether.`],
[`She said she ___ that film before.`,[`had seen`,`has seen`,`saw`],0,`Present perfect → past perfect.`],
[`They suggested ___ on Monday.`,[`meeting`,`to meet`,`meet`],0,`Suggest + -ing.`],
[`He asked me ___ him with the homework.`,[`to help`,`help`,`helping`],0,`Asked + objeto + to + verbo.`]]);
G('g26','Relativas avanzadas y preposiciones',`Relativas no definitivas (entre comas): who, which, whose, where, when. No se usa that.
Preposición + relativo: about which, for which, in which, o whom en registro formal.
why = the reason why. when = the day when. where = the hotel where.
Whose = posesión: the woman whose car was stolen.`,[
[`The company ___ profits rose sharply is based in Madrid.`,[`whose`,`who`,`which`],0,`Whose expresa posesión: whose profits.`],
[`The hotel, ___ we stayed last summer, has closed.`,[`where`,`which`,`who`],0,`Lugar: where. Sin preposición adicional.`],
[`The day ___ I met him was the best day of my life.`,[`when`,`which`,`where`],0,`Momento: when.`],
[`The book ___ I am reading is excellent.`,[`which`,`where`,`when`],0,`Relativa definitiva sin comas: which o that.`],
[`My sister, ___ lives in Canada, is a nurse.`,[`who`,`which`,`whose`],0,`Persona en relativa no definitiva: who.`],
[`I do not know the reason ___ she left so suddenly.`,[`why`,`where`,`when`],0,`Reason + why.`],
[`Paris, ___ I visited last year, is beautiful.`,[`which`,`that`,`who`],0,`Relativa no definitiva: which, nunca that.`],
[`The exam, ___ I was very nervous, was easy.`,[`about which`,`which about`,`about that`],0,`Preposición + which: about which I was nervous.`]]);
G('g27','Estructuras para Writing: argumentar',`Estructuras que dan rigor a un argumento:
It is widely believed that… (se cree ampliamente que)
be likely to + verbo (probablemente)
Not only… but also…, con inversión si va al principio: Not only is it cheaper…
The more…, the more / the less…
Such + was/is + the impact that…, so + adjetivo + that…, such a + sustantivo + that…
in order to / so as to + verbo (para), nunca for + verbo.
whether + to + verbo (si hacer algo o no).`,[
[`___ is widely believed that remote work increases productivity.`,[`It`,`This`,`Which`],0,`It is widely believed that… es una frórmula de argumentación.`],
[`The new policy is ___ to benefit both workers and employers.`,[`likely`,`probable`,`possibility`],0,`Be likely to + verbo.`],
[`Not only ___ cheaper, but it is also faster.`,[`is it`,`it is`,`is`],0,`Not only al principio exige inversión: is it cheaper.`],
[`The more people use public transport, ___ traffic will be.`,[`the less`,`less`,`fewer`],0,`The more…, the less…`],
[`Such ___ the impact that the government had to act.`,[`was`,`is`,`were`],0,`Such was the impact that… (registro formal).`],
[`The city has become so ___ that tourists cannot find a quiet place.`,[`crowded`,`crowd`,`crowding`],0,`So + adjetivo + that.`],
[`Governments should act ___ to protect the environment.`,[`in order to`,`for`,`in`],0,`In order to + verbo: finalidad.`],
[`Students must decide ___ to study abroad or stay at home.`,[`whether`,`if`,`what`],0,`Whether + to + verbo: si hacer algo o no.`]]);
G('g28','Estructuras para Reading: referencia y cohesión',`En Reading, muchas preguntas dependen de saber a qué se refiere una palabra.
This / these / such: pueden resumir una idea anterior. This va en singular, these en plural.
Which: puede referirse a toda la oración anterior (The company raised prices, which angered customers).
Others / the others / another: Some passed; others failed.
It y they: buscan el sustantivo anterior del mismo número.`,[
[`Many people commute by car. ___ causes heavy traffic every morning.`,[`This`,`These`,`Those`],0,`This resume la idea de ir al trabajo en coche, y causes va en singular.`],
[`Scientists found new evidence. ___ findings challenge the old theory.`,[`These`,`This`,`Those`],0,`These: plural, por eso findings.`],
[`The company cut costs and raised prices, ___ angered customers.`,[`which`,`who`,`whose`],0,`Which se refiere a toda la oración anterior.`],
[`Some students passed the test; ___ failed.`,[`others`,`another`,`other`],0,`Others = otros (plural), sin sustantivo detrás.`],
[`The article was long, but ___ was worth reading.`,[`it`,`they`,`there`],0,`It se refiere a article, singular.`],
[`Both candidates were qualified, ___ only one could be hired.`,[`but`,`so`,`while`],0,`Contraste entre ambos y solo uno: but.`],
[`She is not only talented ___ also hardworking.`,[`but`,`and`,`or`],0,`Not only… but also…`],
[`Such was the success of the campaign ___ it was extended.`,[`that`,`which`,`what`],0,`Such… that…: consecuencia.`]]);
G('g29','Estructuras de contraste y concesión en textos',`Whereas / while: contraste entre dos ideas (Whereas many prefer cities, others prefer the countryside).
Rather than + verbo base o -ing: en lugar de (rather than take the bus).
Instead of + -ing: en lugar de (instead of reducing taxes).
Contrary to + sustantivo: al contrario de lo que se cree.
In light of + sustantivo: dada una situación o información.
Either… or… / neither… nor… / not only… but also…: pares correlativos.`,[
[`___ most people prefer cities, many prefer the countryside.`,[`Whereas`,`Because`,`Unless`],0,`Whereas: contraste entre dos grupos.`],
[`He chose to walk ___ take the bus.`,[`rather than`,`instead than`,`more than`],0,`Rather than: en lugar de.`],
[`___ popular belief, sleep is not wasted time.`,[`Contrary to`,`Opposite`,`Contrarily`],0,`Contrary to + sustantivo.`],
[`___ the results, the team decided to change its strategy.`,[`In light of`,`Regarding to`,`Under`],0,`In light of: dada la situación.`],
[`___ reducing taxes, the government increased spending.`,[`Instead of`,`Rather of`,`Instead`],0,`Instead of + -ing.`],
[`She not only ___ the exam, but she also got the top mark.`,[`passed`,`pass`,`passing`],0,`Not only + pasado simple: passed.`],
[`The film was ___ by critics, but audiences found it boring.`,[`praised`,`praising`,`praise`],0,`Voz pasiva: was praised.`],
[`We can hold the meeting either on Monday ___ on Tuesday.`,[`or`,`nor`,`and`],0,`Either… or…`]]);
G('g30','Estructuras para Writing: conclusiones',`Para cerrar un texto de Writing, usa frórmulas de conclusión y no repitas la misma.
On balance (en conjunto), all things considered (teniendo todo en cuenta), to sum up (en resumen).
It can be argued that… (se puede argumentar que…)
In the long run (a largo plazo), there is no doubt that…
El verbo de la conclusión va en presente: This essay argues that…`,[
[`___, the advantages outweigh the disadvantages.`,[`On balance`,`On the other hand`,`Furthermore`],0,`On balance: conclusión tras sopesar argumentos.`],
[`___ the evidence, the policy should be reconsidered.`,[`In view of`,`Regarding`,`Considering of`],0,`In view of: a la vista de.`],
[`To sum up, the ___ are clear: the plan should go ahead.`,[`arguments`,`argue`,`argued`],0,`Sustantivo tras el: the arguments.`],
[`___ all things considered, the plan is worth supporting.`,[`All`,`Each`,`Every`],0,`All things considered: fija.`],
[`It can be ___ that technology improves education.`,[`argued`,`arguing`,`argue`],0,`It can be argued that…: pasiva con participio.`],
[`In the long ___, saving money is more important.`,[`run`,`term`,`end`],0,`In the long run: a largo plazo.`],
[`There is ___ doubt that exercise improves health.`,[`no`,`none`,`not`],0,`There is no doubt that…`],
[`This essay ___ that remote work should be encouraged.`,[`argues`,`arguments`,`argument`],0,`Verbo en presente: argues.`]]);

[`What is the man's opinion of the restaurant?`,[`He was impressed by everything`,`He was disappointed overall`,`He wants to go back soon`],1,`Nunca dice disappointed: se infiere. Well… anuncia una crítica; I won't be rushing back = no pienso volver pronto; eye-watering = carísimo.`,2,`Woman: So, how was the new restaurant? Man: Well, the decor was lovely, and the staff were very polite. Woman: But? Man: Let's just say I won't be rushing back. I was still hungry when I left, and the bill was eye-watering.`],
[`How does the speaker feel now about giving presentations?`,[`Still very anxious`,`More confident than before`,`Bored by them`],1,`Dreading = temer algo que va a pasar. El cambio llega con but once I got going, y al final casi tiene ganas (almost looking forward).`,2,`I had been dreading the presentation for weeks, but once I got going, the questions from the audience were actually the best part. I am almost looking forward to the next one.`],
[`What is the woman's attitude?`,[`She is pleased`,`She is being sarcastic`,`She is apologising`],1,`Ironía: dice que era justo como quería pasar el fin de semana, pero obviously indica lo contrario. Nadie planea pasar el fin de semana haciendo un informe.`,3,`Man: Did you finish the report? Woman: Oh yes, I spent my whole weekend on it. Which was exactly how I had planned to spend my weekend, obviously.`],
[`What is the speaker's overall view of the course?`,[`Very positive`,`Mixed`,`Completely negative`],1,`I would not say… but… either = postura intermedia. Some sessions were useful; others felt like padding (relleno).`,2,`I would not say the course was a waste of money, but I am not sure I would recommend it to a friend either. Some sessions were useful; others felt like padding.`],
[`What does the man think the woman should do?`,[`Turn down the offer`,`Accept the job`,`Ask for more money`],1,`No lo dice directamente: lo infieres de That is fantastic y de que le recuerda que lleva tiempo diciendo que necesita un cambio.`,2,`Woman: They have offered me the job in Dublin. Man: That is fantastic! Woman: Is it? It means leaving everyone I know, and the rent there is crazy. Man: True, but you have been saying for ages that you need a change.`],
[`What is the speaker's main point?`,[`Screen time should be strictly limited`,`What children do on screens matters more than how long`,`Parents should ban screens at home`],1,`Contrary to what many parents assume introduce una idea contraria a la habitual; la clave llega con what seems to matter far more.`,3,`Contrary to what many parents assume, the research suggests that limiting screen time on its own makes little difference. What seems to matter far more is what children are actually doing on those screens.`],
[`What is the woman doing?`,[`Criticising his choice`,`Giving practical advice`,`Offering to lend him her car`],1,`If I were you = consejo. No critica la idea del coche eléctrico; le dice qué comprobar primero.`,2,`Man: I am thinking of buying an electric car. Woman: Have you checked how many charging points there are near your flat? Man: Not yet. Woman: I would do that before anything else, if I were you.`],
[`What is the speaker's attitude towards the new timetable?`,[`Critical`,`Enthusiastic`,`Neutral`],0,`Frankly anuncia una crítica. Certainly… but es una concesión: admite una ventaja y después da el problema.`,2,`Frankly, the new timetable has caused more problems than it has solved. Trains are certainly more frequent, but they are so packed at rush hour that many people simply cannot get on.`]]);

[`She has been working here ___ last spring.`,[`since`,`for`,`from`],0,`Since + punto de partida (last spring). For va con una duración.`,1],
[`The museum ___ in 1890.`,[`was built`,`has been built`,`built`],0,`Pasiva en pasado: hay una fecha terminada (1890), así que no va present perfect.`,1],
[`The film is ___ on a true story.`,[`based`,`founded`,`built`],0,`Be based on = estar basado en.`,1],
[`There is a good ___ that it will rain this afternoon.`,[`chance`,`luck`,`opportunity`],0,`Chance = probabilidad. Luck es suerte y opportunity, oportunidad.`,1],
[`Hardly anyone ___ up to the meeting.`,[`turned`,`took`,`gave`],0,`Turn up = aparecer, presentarse.`,2],
[`The concert was ___ off because of the storm.`,[`called`,`gave`,`took`],0,`Call off = cancelar.`,2],
[`We need to ___ up with a better plan.`,[`come`,`get`,`go`],0,`Come up with = idear, proponer.`,2],
[`She is ___ to accept the offer because she has doubts.`,[`reluctant`,`eager`,`keen`],0,`Reluctant = reacio. Eager y keen significan tener ganas: lo contrario.`,2],
[`He has a ___ knowledge of European history.`,[`thorough`,`through`,`though`],0,`Thorough = profundo, exhaustivo. Cuidado con through (a través de) y though (aunque).`,2],
[`The new manager is very ___; she always listens to her staff.`,[`approachable`,`approaching`,`approached`],0,`Approachable = accesible, cercano.`,2],
[`By the end of the course, students ___ over 2,000 new words.`,[`will have learnt`,`will learn`,`learn`],0,`Futuro perfecto con by the end of: algo terminado antes de un momento futuro.`,2],
[`It is no use ___ about it now; the decision has been made.`,[`complaining`,`to complain`,`complain`],0,`It is no use + -ing = no sirve de nada.`,2],
[`The minister refused to ___ on the rumours.`,[`comment`,`say`,`tell`],0,`Comment on = hacer comentarios sobre algo. Say y tell no llevan on.`,2],
[`Prices vary ___ on the season.`,[`depending`,`depends`,`depend`],0,`Depending on = según, dependiendo de.`,2],
[`Such ___ the demand that tickets sold out in minutes.`,[`was`,`were`,`had`],0,`Such was the demand that… (registro formal): la demanda fue tal que…`,3],
[`Only after the meeting ___ how serious the problem was.`,[`did I realise`,`I realised`,`I did realise`],0,`Only after + inversión auxiliar-sujeto en la oración principal.`,3],
[`The proposal was met with widespread ___.`,[`scepticism`,`sceptical`,`sceptic`],0,`Tras un adjetivo (widespread) va un sustantivo: scepticism (escepticismo).`,3],
[`She is ___ for her generosity.`,[`renowned`,`renewed`,`reminded`],0,`Renowned = famoso, célebre.`,3],
[`He ___ to have left the country last week.`,[`is believed`,`believes`,`is believing`],0,`Pasiva impersonal: is believed to have + participio para el pasado.`,3],

[`Much ___ I would like to help, I simply cannot.`,[`as`,`though`,`that`],0,`Much as = por mucho que (concesión, C1).`,3],
[`She managed to keep her ___ despite the pressure.`,[`composure`,`compose`,`composition`],0,`Composure = calma, compostura.`,3]]);

G('g31','Falsos amigos (false friends)',`Palabras que parecen españolas pero significan otra cosa:
actually = en realidad (actualmente = currently)
eventually = al final, finalmente (eventualmente = possibly)
sensible = sensato (sensible = sensitive)
embarrassed = avergonzado (embarazada = pregnant)
attend = asistir a (assist = ayudar)
library = biblioteca (librería = bookshop)
career = carrera profesional (carrera universitaria = degree)
realise = darse cuenta (realizar = carry out)
argument = discusión, pelea
exit = salida (éxito = success)`,[
[`I thought the film would be boring, but ___ it was quite good.`,[`actually`,`currently`,`nowadays`],0,`Actually = en realidad. Currently = actualmente.`],
[`She is ___ working as a nurse in Leeds.`,[`currently`,`actually`,`eventually`],0,`Currently = actualmente, en este momento.`],
[`After hours of waiting, the train ___ arrived.`,[`eventually`,`possibly`,`occasionally`],0,`Eventually = al final, finalmente. No significa eventualmente.`],
[`He is a very ___ person; he always makes good decisions.`,[`sensible`,`sensitive`,`nervous`],0,`Sensible = sensato. Sensitive = sensible (emocionalmente).`],
[`She is very ___ and cries at sad films.`,[`sensitive`,`sensible`,`sensational`],0,`Sensitive = sensible, que se emociona con facilidad.`],
[`I felt really ___ when I forgot her name.`,[`embarrassed`,`pregnant`,`embarrassing`],0,`Embarrassed = avergonzado (cómo te sientes). Embarrassing describe la situación. Embarazada es pregnant.`],
[`Over 200 people ___ the conference last year.`,[`attended`,`assisted`,`helped`],0,`Attend = asistir a un evento. Assist = ayudar.`],
[`I borrowed this novel from the ___.`,[`library`,`bookshop`,`librarian`],0,`Library = biblioteca (se toman libros prestados). Bookshop = librería.`],
[`She has had a successful ___ in banking.`,[`career`,`race`,`degree`],0,`Career = carrera profesional. Degree = título universitario.`],
[`I suddenly ___ that I had left my keys at home.`,[`realised`,`carried out`,`performed`],0,`Realise = darse cuenta. Realizar se traduce como carry out.`],
[`They had a big ___ about money and stopped speaking to each other.`,[`argument`,`discussion`,`conversation`],0,`Argument = discusión, pelea. Discussion es un debate tranquilo.`],
[`The emergency ___ is at the back of the building.`,[`exit`,`success`,`output`],0,`Exit = salida. Success = éxito.`]]);
G('g32','Preposiciones dependientes',`Muchas palabras llevan siempre la misma preposición. Apréndelas en bloque.
Adjetivo + preposición: good at, interested in, afraid of, aware of, keen on, similar to, responsible for.
Verbo + preposición: depend on, succeed in, consist of, apologise for, insist on, accuse someone of, congratulate someone on.
Sustantivo + preposición: increase in, solution to, reason for, demand for.
Si detrás va un verbo, va en -ing: good at solving, succeed in passing.`,[
[`She is very good ___ solving problems.`,[`at`,`in`,`on`],0,`Good at + -ing.`],
[`Whether we go out depends ___ the weather.`,[`on`,`of`,`from`],0,`Depend on. En español decimos depender de, pero en inglés es on.`],
[`Are you aware ___ the risks?`,[`of`,`about`,`with`],0,`Aware of = consciente de.`],
[`He succeeded ___ passing the exam at the first attempt.`,[`in`,`on`,`at`],0,`Succeed in + -ing.`],
[`The team consists ___ five engineers.`,[`of`,`in`,`by`],0,`Consist of = estar formado por.`],
[`There has been a sharp increase ___ prices.`,[`in`,`of`,`on`],0,`Increase in + lo que sube (prices). Con una cifra se usa of: an increase of 5%.`],
[`They congratulated her ___ her promotion.`,[`on`,`for`,`about`],0,`Congratulate someone on something.`],
[`This phone is very similar ___ mine.`,[`to`,`with`,`as`],0,`Similar to.`],
[`We cannot find a solution ___ this problem.`,[`to`,`of`,`at`],0,`Solution to a problem.`],
[`He was accused ___ stealing the money.`,[`of`,`for`,`with`],0,`Accuse someone of + -ing.`],
[`I am not very keen ___ horror films.`,[`on`,`of`,`in`],0,`Keen on = aficionado a, con ganas de.`],
[`Who is responsible ___ this department?`,[`for`,`of`,`about`],0,`Responsible for.`]]);
G('g33','Present perfect, past simple y since, for, ago',`Past simple: tiempo terminado (yesterday, last week, in 2019, three years ago, when…?).
Present perfect: tiempo no terminado o sin momento concreto (ever, never, yet, already, just, so far, this week, the first time).
Since + punto de partida (since 2018, since Monday). For + duración (for six years). Ago + pasado simple (three years ago).
How long…? + present perfect para algo que sigue ocurriendo.`,[
[`I ___ him yesterday at the station.`,[`saw`,`have seen`,`had seen`],0,`Yesterday es tiempo terminado: pasado simple.`],
[`I ___ him since we left school.`,[`haven't seen`,`didn't see`,`don't see`],0,`Since + present perfect: desde entonces hasta ahora.`],
[`She has worked here ___ 2018.`,[`since`,`for`,`from`],0,`Since + año o momento de inicio.`],
[`She has worked here ___ six years.`,[`for`,`since`,`during`],0,`For + duración.`],
[`They moved to Madrid three years ___.`,[`ago`,`since`,`for`],0,`Ago va detrás de la cantidad de tiempo y con pasado simple.`],
[`___ you ever been to Ireland?`,[`Have`,`Did`,`Were`],0,`Ever = alguna vez en tu vida: present perfect.`],
[`How long ___ you known your best friend?`,[`have`,`did`,`do`],0,`How long + present perfect para algo que continúa.`],
[`I ___ my homework yet.`,[`haven't finished`,`didn't finish`,`don't finish`],0,`Yet en negativa va con present perfect.`],
[`When ___ you start learning English?`,[`did`,`have`,`had`],0,`When pregunta por un momento concreto: pasado simple.`],
[`This is the first time I ___ sushi.`,[`have eaten`,`ate`,`eat`],0,`This is the first time + present perfect.`],
[`We ___ three exams so far this term.`,[`have had`,`had`,`have`],0,`So far y this term = periodo no terminado: present perfect.`],
[`He ___ in Paris for two years, but now he lives in Rome.`,[`lived`,`has lived`,`has been living`],0,`Ya no vive allí: etapa terminada, pasado simple.`]]);
G('g34','Palabras que se confunden: lend/borrow, say/tell…',`lend = prestar (dar) / borrow = pedir prestado (recibir)
say something / tell someone something
steal something / rob a person or a place
remind someone to do something / remember to do something
make: a decision, a mistake, an appointment, money / do: a favour, homework, your best
earn money (trabajando) / win a prize (compitiendo)
raise something (transitivo) / rise (intransitivo)
take = llevar desde aquí / bring = traer hacia aquí`,[
[`Can you ___ me some money until Friday?`,[`lend`,`borrow`,`owe`],0,`Lend = prestar: el dinero sale de ti hacia otra persona.`],
[`Can I ___ your pen for a minute?`,[`borrow`,`lend`,`give back`],0,`Borrow = pedir prestado: el bolígrafo viene a ti.`],
[`She ___ me that she was moving abroad.`,[`told`,`said`,`spoke`],0,`Tell + persona: told me.`],
[`He ___ that he was tired.`,[`said`,`told`,`talked`],0,`Say sin persona detrás: said that.`],
[`Someone ___ my bike last night.`,[`stole`,`robbed`,`burgled`],0,`Steal + la cosa robada.`],
[`Two men ___ the bank and escaped in a car.`,[`robbed`,`stole`,`took off`],0,`Rob + el lugar o la persona.`],
[`Please ___ me to call my mother later.`,[`remind`,`remember`,`recall`],0,`Remind someone to do something = recordárselo a alguien.`],
[`I need to ___ an appointment with the dentist.`,[`make`,`do`,`take`],0,`Make an appointment = pedir cita.`],
[`Could you ___ me a favour?`,[`do`,`make`,`give`],0,`Do someone a favour.`],
[`She ___ a lot of money as a lawyer.`,[`earns`,`wins`,`gains`],0,`Earn money = ganar dinero trabajando. Win = ganar un premio o una competición.`],
[`He ___ his hand to ask a question.`,[`raised`,`rose`,`arose`],0,`Raise lleva objeto (his hand). Rise no lleva objeto.`],
[`Don't forget to ___ your umbrella when you go out.`,[`take`,`bring`,`lead`],0,`Take = llevar contigo desde donde estás. Bring = traer hacia donde está quien habla.`]]);
G('g35','Vocabulary tipo Aptis: sinónimos, definiciones y colocaciones',`En la parte de Vocabulary del examen salen tres tipos de pregunta:
1. Sinónimos: elegir la palabra con un significado parecido.
2. Definiciones: elegir la palabra que corresponde a una explicación.
3. Colocaciones: elegir la palabra que se combina con otra (heavy rain, make a mistake).
Truco: pon la palabra en una frase mental. Si suena rara, descarta esa opción.`,[
[`Which word is closest in meaning to RELUCTANT?`,[`unwilling`,`eager`,`tired`],0,`Reluctant = reacio, poco dispuesto. Eager significa lo contrario.`],
[`Which word is closest in meaning to ACCURATE?`,[`correct`,`careful`,`quick`],0,`Accurate = exacto, correcto. Careful es cuidadoso: relacionado, pero no igual.`],
[`Which word is closest in meaning to ESSENTIAL?`,[`vital`,`optional`,`expensive`],0,`Essential = imprescindible, como vital.`],
[`Which word is closest in meaning to ENORMOUS?`,[`huge`,`heavy`,`narrow`],0,`Enormous = enorme, como huge.`],
[`Which word is closest in meaning to ANNUAL?`,[`yearly`,`monthly`,`daily`],0,`Annual = anual.`],
[`A person who travels to work every day is a ___.`,[`commuter`,`tourist`,`passenger`],0,`Commuter = quien se desplaza a diario al trabajo. Passenger es cualquier viajero de un vehículo.`],
[`Money that you have to pay to the government is ___.`,[`tax`,`fee`,`wage`],0,`Tax = impuesto. Fee es una tarifa por un servicio y wage, un salario.`],
[`A short break between two parts of a play or concert is an ___.`,[`interval`,`interview`,`invoice`],0,`Interval = intermedio, descanso.`],
[`Someone who is easily annoyed is ___.`,[`irritable`,`irresponsible`,`irregular`],0,`Irritable = que se enfada con facilidad.`],
[`Which word goes best with RAIN? ___ rain`,[`heavy`,`strong`,`big`],0,`Heavy rain = lluvia fuerte. Strong rain no es natural en inglés.`],
[`Which word goes best with MISTAKE? ___ a mistake`,[`make`,`do`,`have`],0,`Make a mistake = cometer un error.`],
[`Which word goes best with ATTENTION? ___ attention`,[`pay`,`take`,`make`],0,`Pay attention = prestar atención.`],
[`Which word goes best with TRAFFIC? ___ traffic`,[`heavy`,`crowded`,`thick`],0,`Heavy traffic = mucho tráfico.`],
[`Which word goes best with DECISION? a ___ decision`,[`tough`,`hard-working`,`heavy`],0,`A tough decision = una decisión difícil.`]]);
/* ===== GEMELO DE APRENDIZAJE =====
Modelo del estudiante: cada respuesta suma a una categoría de error. Las categorías siguen los errores típicos de hispanohablantes descritos en la enseñanza de inglés (p. ej. Swan y Smith, Learner English). Por categoría guarda los últimos 20 resultados (a) y los de la primera vez que se ve una pregunta (n): esa segunda cifra mide si se ha aprendido la regla y no la respuesta. Debilidad = 1 - acierto en nuevas (o reciente) + 0,05 por cada error de esa categoría en Writing/Speaking corregidos por Claude. */
const CATS={
suj:['Sujeto obligatorio (It is…, There is…)','En español el sujeto se omite («Es importante», «Hay…»). En inglés casi siempre hace falta: It is important, There are…'],
orden:['Orden de palabras y adjetivos','En español el adjetivo va detrás y el adverbio se mueve con libertad. En inglés: adjetivo delante (a red car), office work, y nunca entre verbo y objeto (I like it very much).'],
ff:['Falsos amigos','Palabras parecidas al español con otro significado: actually, eventually, sensible, embarrassed, attend, library, realise…'],
prep:['Preposiciones','Las traducimos palabra por palabra: depend of, married with, arrive to, think in. En inglés son fijas: depend on, married to, arrive in/at, think about.'],
pp:['Present perfect, since, for y ago','El español usa presente («Vivo aquí desde 2018», «Llevo dos horas esperando»); el inglés, present perfect (I have lived here since 2018). Y «el año pasado» va siempre con pasado simple.'],
tiem:['Tiempos verbales, pasiva y modales','Will, going to y presente continuo para el futuro; used to; pasiva; modales como mustn’t frente a don’t have to. El español reparte estos significados de otra forma.'],
ger:['Verbo + -ing / to y el calco del subjuntivo','«Quiero que vengas» se calca como I want that you come; en inglés es I want you to come. Y el segundo verbo lo decide el verbo de delante, no el significado en español: enjoy, avoid o suggest van con -ing; want, hope o decide, con to. Pista: to suele mirar a algo que aún no ha pasado; -ing, a la actividad en sí.'],
art:['Artículos','El español pone «el/la» al generalizar («La vida es…», «El inglés es difícil»). En inglés no: Life is…, English is… Y las profesiones llevan a: She is a teacher.'],
inc:['Incontables, concordancia y comparativos','Information, advice y news son incontables; people es plural. Many/much, few/little, taller than.'],
preg:['Preguntas, negativas y estilo indirecto','Orden de la pregunta (What does it mean?), sin inversión en preguntas indirectas (where the station is) y sin doble negación (I don’t know anything).'],
conf:['Palabras que se confunden y «tener»','make/do, say/tell, lend/borrow, rob/steal. Y estructuras con tener que en inglés van con be: I am 30, I am hungry, I agree.'],
cond:['Condicionales y wish','«Si tendría» es un calco: en inglés nunca va would detrás de if. If I had…, I would…; y when + presente para el futuro (When I finish…).'],
estr:['Estructuras avanzadas (B2-C1)','Relativas, inversión (Not only…, Hardly…) y oraciones hendidas (It was… that…).'],
con:['Conectores','Although, despite y however llevan estructuras distintas. «Aunque… pero» no se calca: Although it rained, we went out (sin but).'],
voc:['Vocabulario, colocaciones y formación de palabras','Combinaciones fijas (heavy rain, pay attention, make a mistake), phrasal verbs y sufijos (pollution, renewable).'],
pron:['Sonidos difíciles (solo oído)','El español tiene 5 vocales y el inglés unas 12: ship/sheep, full/fool, cat/cut. Tampoco distinguimos b/v ni th/s. Aquí solo se entrena el oído: la app no puede evaluar tu pronunciación.']};

[`«Me mudé hace tres años.»`,[`I moved three years ago.`,`I moved since three years.`,`It makes three years that I moved.`],`Ago va detrás de la cantidad de tiempo y con pasado simple. «Hace» no se traduce con make.`,'pp',2],

const PA=[`Several companies in Britain have recently tested a four-day working week, paying staff the same salary for fewer hours. The idea is not new, but interest has grown since the pandemic changed how many people think about work.`,`In most trials, managers reported that productivity stayed the same or even improved. Employees, they said, wasted less time in meetings and concentrated better because they knew they had less time to finish their tasks.`,`Workers were particularly positive about their health. Many said they slept better, felt less stressed and had more time for exercise, family and hobbies. Sick days also fell noticeably.`,`However, the model does not suit every sector. Hospitals, schools and shops need staff to be present every day, so they cannot simply close on Fridays. Some firms solved this by giving employees different days off.`,`Critics also warn that early results may be too optimistic. Companies that volunteer for a trial are usually already flexible and well organised, so it is unclear whether the same success would be repeated elsewhere.`];
const PB=[`People are notoriously poor at estimating risk. We fear flying far more than driving, even though, mile for mile, cars are considerably more dangerous. Psychologists have spent decades trying to explain this apparent irrationality.`,`One explanation lies in how memorable an event is. Dramatic, widely reported disasters stay in our minds, so we overestimate how often they occur, while everyday dangers, which rarely make headlines, fade into the background.`,`A sense of control also plays a part. Drivers feel they are in charge of what happens, whereas passengers on a plane must place their trust in others. Risks we choose, or believe we can manage, tend to seem smaller.`,`Our judgements are further distorted by the way information is presented. A treatment described as having a 90 per cent survival rate is viewed far more favourably than one with a ten per cent death rate, although the two figures are identical.`,`None of this means that such instincts are useless. Rapid, emotional reactions may once have protected our ancestors, who could not afford to calculate probabilities when faced with immediate threats.`];

/* Glosario sin tecnicismos: para quien no domina la terminología gramatical del español. Cada término con su «fórmula» y un ejemplo. */
const GLO=[
['Sujeto','Quién hace la acción. En inglés casi siempre tiene que aparecer.','<b>It</b> is important. <b>She</b> works here.'],
['Verbo','La acción o el estado.','I <b>work</b>. She <b>is</b> tired.'],
['Verbo base (infinitivo sin to)','El verbo tal cual aparece en el diccionario.','<b>go</b>, <b>eat</b>, <b>be</b>'],
['To + verbo (infinitivo)','El verbo con to delante.','I want <b>to learn</b>.'],
['Verbo + -ing (gerundio)','El verbo terminado en -ing. Puede funcionar como un sustantivo.','I enjoy <b>reading</b>.'],
['Participio','La forma de los tiempos compuestos y de la pasiva (la 3.ª columna de los irregulares).','I have <b>eaten</b>. It was <b>built</b>.'],
['Auxiliar','Un verbo «ayudante» para preguntas, negativas y tiempos: do, does, did, have, be, will.','<b>Do</b> you work? I <b>have</b> finished.'],
['Subjuntivo (español)','Las formas de «que vengas», «que sea», «si tuviera». El inglés casi no las tiene: usa otras fórmulas.','Quiero que vengas = I want you <b>to come</b>.'],
['Sustantivo contable / incontable','Contable: se puede contar (one book, two books). Incontable: no tiene plural ni lleva a.','<b>information</b>, <b>advice</b>, <b>news</b> son incontables.'],
['Preposición','Palabras cortas que unen: in, on, at, of, to, for, about…','depend <b>on</b>, married <b>to</b>'],
['Conector','Palabra que une ideas: although, however, because, so…','<b>Although</b> it rained, we went out.'],
['Pasiva','Cuando importa lo que recibe la acción más que quién la hace. Fórmula: be + participio.','The bridge <b>was built</b> in 1990.'],
['Present perfect','Fórmula: have / has + participio. Une un pasado con el ahora.','I <b>have lived</b> here since 2018.'],
['Oración de relativo','Una mini-frase que da información sobre algo: who, which, whose, where.','The woman <b>who lives next door</b>…'],
['Estilo indirecto','Contar lo que dijo otra persona. Los tiempos «dan un paso atrás».','«I am tired» → She said she <b>was</b> tired.'],
['Inversión','Cambiar el orden normal y poner el auxiliar antes del sujeto, para dar énfasis (C1).','Not only <b>is it</b> cheap…'],
['Colocación','Palabras que van juntas por costumbre, como una fórmula fija.','<b>make</b> a mistake, <b>heavy</b> rain']];
const gloHTML=()=>`<details class=card><summary>📘 Glosario sin tecnicismos</summary><p class=mut>Si un término gramatical no te suena, aquí está explicado con una fórmula y un ejemplo.</p>${GLO.map(g=>`<p><b>${g[0]}</b>: ${g[1]}<br><span class=mut>${g[2]}</span></p>`).join('')}</details>`;
